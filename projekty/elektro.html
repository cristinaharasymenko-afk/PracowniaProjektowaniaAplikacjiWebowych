<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektro-Bud</title>
    <link rel="stylesheet" href="elektro.css">
</head>
<body>
    <h1>Elektro-Bud</h1>
    <h2>Wpisz produkt</h2>
    <label for="nazwa">Nazwa Produktu</label>
    <input type="text" id="nazwa"><div></div>

     <label for="kategoria">Kategoria</label>
    <input type="text" id="kategoria"><div></div>

     <label for="kod">Kod EAN</label>
    <input type="text" id="kod"><div></div>

    <button id="dodaj">Dodaj produkt</button>
    <p id="komunikat"></p>

    <h2>Lista produktow</h2>

<table id="tabelaProduktow">
    <thead>
        <tr>
            <th>Nazwa</th>
            <th>Kategoria</th>
            <th>Kod EAN</th>
            <th>Usun produkt</th>
        </tr>
    </thead>
    <tbody id="listaProduktow"></tbody>
    </table>
    <script src="public/elektro.js"></script>

</body>
</html>
